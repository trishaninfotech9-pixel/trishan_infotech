<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- NAVBAR (shared: components/header) -->
<div data-component="header" data-page="login"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- LOGIN FORM -->
<!-- LOGIN -->
<section class="w-full max-w-7xl mx-auto px-6 lg:px-10 py-2 flex-1 flex items-center justify-center min-h-0">
  <div class="max-w-[400px] w-full mx-auto border border-navy-100 rounded p-5 sm:p-6" data-animate="fade-up">
    <div class="w-9 h-9 rounded bg-navy-50 flex items-center justify-center mb-3 mx-auto">
      <i class="bi bi-person-lock text-navy text-lg"></i>
    </div>
    <h1 class="hero-title text-xl sm:text-2xl font-extrabold text-center text-gradient mb-1.5">Welcome back</h1>
    <p class="hero-lead text-[13px] text-navy-900/70 text-center mb-4">Login with your phone number or email and password.</p>

    <form id="loginForm" class="bs-reset space-y-3" method="POST" action="#">
      <div>
        <label for="loginPhone" class="block text-[13px] font-semibold text-navy mb-1">Phone Number or Email</label>
        <input required type="text" name="login" id="loginPhone" placeholder="Enter phone number or email" autocomplete="username" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
      </div>
      <div>
        <label for="loginPassword" class="block text-[13px] font-semibold text-navy mb-1">Password</label>
        <div class="relative">
          <input required type="password" name="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" minlength="4" class="border border-navy-100 rounded pl-3.5 pr-11 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
          <button type="button" data-toggle-password="loginPassword" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-navy-900/50 hover:text-navy transition" aria-label="Show password"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="bg-navy text-white text-[15px] font-semibold px-6 py-2 rounded hover:bg-navy-700 transition w-full">Login</button>
      <p id="loginMsg" class="hidden text-[13px] text-center mt-2"></p>
    </form>

    <p class="text-[13px] text-navy-900/70 text-center mt-3">Don't have an account? <a href="create_account" class="font-semibold text-gold-600 hover:text-navy transition">Create a new account</a></p>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<!-- FOOTER (shared: components/footer) -->
<div data-component="footer" class="mt-auto"></div>

</body>
