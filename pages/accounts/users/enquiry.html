<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Trishan Infotech, Chinsurah Hooghly</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Your Trishan Infotech account dashboard. Ask enquiries about your projects.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css?v=16">
<script src="../../../scripts/script.js?v=10" defer></script>
<script src="../../../scripts/accounts/users/enquiry.js?v=2" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- NAVBAR (shared: components/header) -->
<div data-component="header" data-page="enquiry"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- WELCOME BANNER -->
<!-- WELCOME -->
<section class="border-b border-navy-100">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-8 md:py-10" data-animate="fade-up">
    <div>
      <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-gradient">Welcome, <span id="userFirstName">User</span></h1>
      <p id="welcomeSub" class="hero-lead text-sm text-navy-900/70 mt-1"></p>
      <p class="text-[13px] text-navy-900/60 mt-1"><i class="bi bi-calendar3 me-1"></i><span id="todayDate"></span> (IST)</p>
    </div>
  </div>
</section>

<!-- ENQUIRY FORM -->
<!-- ENQUIRY BOX -->
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-[560px] w-full mx-auto border border-navy-100 rounded p-5 sm:p-6" data-animate="fade-up">
    <div class="w-9 h-9 rounded bg-navy-50 flex items-center justify-center mb-3 mx-auto">
      <i class="bi bi-envelope-paper text-navy text-lg"></i>
    </div>
    <h2 class="hero-title text-xl sm:text-2xl font-extrabold text-center text-gradient mb-1.5">Ask an Enquiry</h2>
    <p class="hero-lead text-[13px] text-navy-900/70 text-center mb-4">Have a question about a project? Send it here and our team will reply — read replies on the Response page.</p>

    <form id="enquiryForm" class="bs-reset space-y-4" action="#">
      <div class="border border-navy-100 rounded p-4">
        <p class="text-[11px] font-bold uppercase tracking-wide text-navy-900/50 mb-3">Your Details</p>
        <div class="space-y-3">
          <div>
            <label for="eFullName" class="block text-[13px] font-semibold text-navy mb-1">Full Name</label>
            <input type="text" id="eFullName" placeholder="Enter your full name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
          </div>
          <div>
            <label for="eProject" class="block text-[13px] font-semibold text-navy mb-1">Project Name</label>
            <input required type="text" id="eProject" placeholder="Enter the related project name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
          </div>
        </div>
      </div>

      <div>
        <label for="eQuestion" class="block text-[11px] font-bold uppercase tracking-wide text-navy-900/50 mb-2">Your Question</label>
        <textarea required id="eQuestion" rows="4" maxlength="5000" placeholder="Ask anything about this project" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700"></textarea>
      </div>

      <button type="submit" class="bg-navy text-white text-[15px] font-semibold px-6 py-2 rounded hover:bg-navy-700 transition w-full inline-flex items-center justify-center gap-2">
        <i class="bi bi-send"></i>Submit Enquiry
      </button>
      <p id="formNote" class="hidden text-[13px] text-center mt-2 text-navy"><i class="bi bi-check-circle me-1"></i>Your enquiry has been submitted.</p>
    </form>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<!-- FOOTER (shared: components/footer) -->
<div data-component="footer" class="mt-auto"></div>

</body>
</html>
