<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Trishan Infotech, Chinsurah Hooghly</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Your Trishan Infotech account dashboard. Submit complaints about your projects.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css?v=16">
<script src="../../../scripts/script.js?v=9" defer></script>
<script src="../../../scripts/accounts/users/users.js" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- NAVBAR (shared: components/header) -->
<div data-component="header" data-page="complaint"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- WELCOME BANNER -->
<!-- WELCOME -->
<section class="border-b border-navy-100">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 py-8 md:py-10" data-animate="fade-up">
    <div>
      <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-gradient">Welcome, <span id="userFirstName">User</span></h1>
      <p id="welcomeSub" class="hero-lead text-sm text-navy-900/70 mt-1"></p>
      <p class="text-[13px] text-navy-900/60 mt-1"><i class="bi bi-calendar3 me-1"></i><span id="todayDate"></span> (IST)</p>
    </div>
  </div>
</section>

<!-- COMPLAINT FORM -->
<!-- COMPLAINT BOX -->
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-[560px] w-full mx-auto border border-navy-100 rounded p-5 sm:p-6" data-animate="fade-up">
    <div class="w-9 h-9 rounded bg-navy-50 flex items-center justify-center mb-3 mx-auto">
      <i class="bi bi-flag text-navy text-lg"></i>
    </div>
    <h2 class="hero-title text-xl sm:text-2xl font-extrabold text-center text-gradient mb-1.5">Submit a Complaint</h2>
    <p class="hero-lead text-[13px] text-navy-900/70 text-center mb-4">Facing an issue with a project? Share the details below and our support team will get back to you shortly.</p>

    <form id="complaintForm" class="bs-reset space-y-4" action="#">
      <!-- Your details -->
      <div class="border border-navy-100 rounded p-4">
        <p class="text-[11px] font-bold uppercase tracking-wide text-navy-900/50 mb-3">Your Details</p>
        <div class="space-y-3">
          <div>
            <label for="cFullName" class="block text-[13px] font-semibold text-navy mb-1">Full Name</label>
            <input type="text" id="cFullName" placeholder="Enter your full name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
          </div>
          <div class="grid sm:grid-cols-2 gap-3">
            <div>
              <label for="cEmail" class="block text-[13px] font-semibold text-navy mb-1">Email ID</label>
              <input type="email" id="cEmail" placeholder="you@example.com" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
            </div>
            <div>
              <label for="cPhone" class="block text-[13px] font-semibold text-navy mb-1">Phone Number</label>
              <input type="tel" id="cPhone" placeholder="Enter phone number" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
            </div>
          </div>
          <div>
            <label for="cProject" class="block text-[13px] font-semibold text-navy mb-1">Project Name</label>
            <input required type="text" id="cProject" placeholder="Enter the related project name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
          </div>
        </div>
      </div>

      <!-- Issue details -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <p class="text-[11px] font-bold uppercase tracking-wide text-navy-900/50">Issue Details</p>
          <span id="issueCountBadge" class="text-[11px] font-semibold text-gold-600 bg-navy-50 px-2.5 py-1 rounded-full">1 issue</span>
        </div>
        <div id="issuesContainer" class="space-y-3"></div>
        <button type="button" id="addIssueBtn" class="mt-3 w-full inline-flex items-center justify-center gap-2 text-sm font-semibold text-gold-600 border border-dashed border-navy-100 rounded py-2 hover:bg-navy-50 transition">
          <i class="bi bi-plus-circle"></i>Add Another Issue
        </button>
      </div>

      <button type="submit" class="bg-navy text-white text-[15px] font-semibold px-6 py-2 rounded hover:bg-navy-700 transition w-full inline-flex items-center justify-center gap-2">
        <i class="bi bi-send"></i>Submit Complaint
      </button>
      <p id="formNote" class="hidden text-[13px] text-center mt-2 text-navy"><i class="bi bi-check-circle me-1"></i>Your complaint has been submitted. Our team will get back to you shortly.</p>
    </form>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<!-- FOOTER (shared: components/footer) -->
<div data-component="footer" class="mt-auto"></div>

</body>
</html>
