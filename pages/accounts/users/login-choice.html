<!-- ================= HEADER ================= -->
<!-- NAVBAR (shared: components/header.html) -->
<div data-component="header" data-page="login"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- LOGIN CHOICE -->
<section class="w-full max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 flex-1">
  <div class="max-w-2xl mx-auto text-center mb-10" data-animate="fade-up">
    <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-gradient mb-3">Choose login type</h1>
    <p class="hero-lead text-sm text-navy-900/70">Select how you want to login to continue.</p>
  </div>
  <!-- LOGIN TYPE CARDS -->
  <div class="grid sm:grid-cols-2 gap-8 max-w-3xl mx-auto">
    <a href="login.html" class="service-card border border-navy-100 rounded p-8 hover:border-navy-700 transition block text-center" data-animate="fade-up" data-delay="0">
      <div class="w-11 h-11 rounded bg-navy-50 flex items-center justify-center mb-6 mx-auto">
        <i class="bi bi-person text-navy text-xl"></i>
      </div>
      <h2 class="font-bold text-lg text-navy mb-3">User Login</h2>
      <p class="text-sm text-navy-900/80 leading-relaxed mb-5">Login with your phone number or email to submit and track complaints.</p>
      <span class="text-sm font-semibold text-gold-600">Continue →</span>
    </a>
    <a href="../admin/admin.html" class="service-card border border-navy-100 rounded p-8 hover:border-navy-700 transition block text-center" data-animate="fade-up" data-delay="100">
      <div class="w-11 h-11 rounded bg-navy-50 flex items-center justify-center mb-6 mx-auto">
        <i class="bi bi-shield-lock text-navy text-xl"></i>
      </div>
      <h2 class="font-bold text-lg text-navy mb-3">Admin Login</h2>
      <p class="text-sm text-navy-900/80 leading-relaxed mb-5">Login with your admin email to manage complaints and responses.</p>
      <span class="text-sm font-semibold text-gold-600">Continue →</span>
    </a>
  </div>
</section>
