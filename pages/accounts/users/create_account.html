<!-- SIGNUP FORM -->
<!-- CREATE ACCOUNT -->
<section class="w-full max-w-7xl mx-auto px-6 lg:px-10 py-2 flex-1 flex items-center justify-center min-h-0">
  <div class="max-w-[560px] w-full mx-auto border border-navy-100 rounded p-5 sm:p-6" data-animate="fade-up">
    <div class="w-9 h-9 rounded bg-navy-50 flex items-center justify-center mb-3 mx-auto">
      <i class="bi bi-person-plus text-navy text-lg"></i>
    </div>
    <h1 class="hero-title text-xl sm:text-2xl font-extrabold text-center text-gradient mb-1.5">Create your account</h1>
    <p class="hero-lead text-[13px] text-navy-900/70 text-center mb-4">Fill in your details to get started.</p>

    <form id="createAccountForm" class="bs-reset space-y-3" method="POST" action="#">
      <div class="grid sm:grid-cols-3 gap-3">
        <div>
          <label for="caFirstName" class="block text-[13px] font-semibold text-navy mb-1">First Name</label>
          <input required type="text" name="first_name" id="caFirstName" placeholder="First name" autocomplete="given-name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
        <div>
          <label for="caMiddleName" class="flex items-baseline gap-1 text-[13px] font-semibold text-navy mb-1">Middle Name <span class="font-normal text-[11px] text-navy-900/60">(optional)</span></label>
          <input type="text" name="middle_name" id="caMiddleName" placeholder="Middle name" autocomplete="additional-name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
        <div>
          <label for="caLastName" class="block text-[13px] font-semibold text-navy mb-1">Last Name</label>
          <input required type="text" name="last_name" id="caLastName" placeholder="Last name" autocomplete="family-name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <div>
          <label for="caPhone" class="block text-[13px] font-semibold text-navy mb-1">Phone Number</label>
          <input required type="tel" name="phone" id="caPhone" placeholder="Enter your phone number" autocomplete="tel" pattern="[0-9+ ]{10,15}" title="Enter a valid phone number" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
        <div>
          <label for="caEmail" class="block text-[13px] font-semibold text-navy mb-1">Email ID</label>
          <input required type="email" name="email" id="caEmail" placeholder="Enter your email" autocomplete="email" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        <div>
          <label for="caPassword" class="block text-[13px] font-semibold text-navy mb-1">Password</label>
          <div class="relative">
            <input required type="password" name="password" id="caPassword" placeholder="Create password" autocomplete="new-password" minlength="4" class="border border-navy-100 rounded pl-3.5 pr-11 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
            <button type="button" data-toggle-password="caPassword" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-navy-900/50 hover:text-navy transition" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div>
          <label for="caConfirmPassword" class="block text-[13px] font-semibold text-navy mb-1">Confirm Password</label>
          <div class="relative">
            <input required type="password" name="confirm_password" id="caConfirmPassword" placeholder="Confirm password" autocomplete="new-password" minlength="4" class="border border-navy-100 rounded pl-3.5 pr-11 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
            <button type="button" data-toggle-password="caConfirmPassword" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-navy-900/50 hover:text-navy transition" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
      </div>
      <button type="submit" class="bg-navy text-white text-[15px] font-semibold px-6 py-2 rounded hover:bg-navy-700 transition w-full">Create Account</button>
      <p id="caMsg" class="hidden text-[13px] text-center mt-2"></p>
    </form>

    <p class="text-[13px] text-navy-900/70 text-center mt-3">Already have an account? <a href="login" class="font-semibold text-gold-600 hover:text-navy transition">Login</a></p>
  </div>
</section>
