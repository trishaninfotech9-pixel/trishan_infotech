<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Complaints | Admin | Trishan Infotech</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin view of all user complaints with reply.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="../../../styles/style.css">
<script src="../../../scripts/script.js" defer></script>
<script src="../../../scripts/accounts/admin/admin-panel.js" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<div class="scroll-progress" aria-hidden="true"></div>

<!-- NAVBAR (shared auth header: Complaint / Response / Logout) -->
<div data-component="header" data-page="new"></div>

<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-6xl mx-auto" id="adminPanelWrap">
    <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-gradient mb-1.5">New Complaints</h1>
    <p class="hero-lead text-sm text-navy-900/70 mb-6">Hi <span id="adminName">Admin</span>, reply below and tick the checkbox to mark a complaint as solved.</p>
    <div id="complaintList" class="space-y-4 overflow-x-auto"></div>
  </div>
</section>

<!-- FOOTER (shared: components/footer.html) -->
<div data-component="footer" class="mt-auto"></div>

</body>
</html>
