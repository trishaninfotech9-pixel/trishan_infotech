<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Trishan Infotech, Chinsurah Hooghly</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin login entry for Trishan Infotech.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css">
<script src="../../../scripts/script.js?v=6" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('adminLoginForm');
    const msg = document.getElementById('adminLoginMsg');
    const btn = form.querySelector('button[type="submit"]');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      msg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const res = await fetch('../../../api/accounts/admin/admin-login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('adminUsername').value.trim(),
            password: document.getElementById('adminPassword').value,
          }),
        });
        const body = await res.json().catch(() => null);
        if (body && body.ok) {
          try {
            const a = body.admin || {};
            if (body.csrf) a.csrf = body.csrf;
            localStorage.setItem('trishan_admin', JSON.stringify(a));
          } catch (err) {}
          msg.textContent = 'Admin login successful. Redirecting…';
          msg.classList.remove('hidden');
          setTimeout(() => { location.href = 'dashboard.html'; }, 1000);
        } else {
          msg.textContent = (body && body.error) || 'Login failed.';
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.textContent = 'Cannot reach server. Start Apache and MySQL in XAMPP.';
        msg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  });
</script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->
<div class="scroll-progress" aria-hidden="true"></div>

<!-- ================= HEADER ================= -->
<!-- HEADER: site navbar (injected from components/header.html) -->
<!-- NAVBAR (shared: components/header.html) -->
<div data-component="header" data-page="login"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- ADMIN ENTRY -->
<section class="w-full max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 flex-1 flex items-center justify-center">
  <!-- LOGIN CARD -->
  <div class="max-w-[400px] w-full mx-auto border border-navy-100 rounded p-8 text-center" data-animate="fade-up">
    <div class="w-11 h-11 rounded bg-navy-50 flex items-center justify-center mb-5 mx-auto">
      <i class="bi bi-shield text-navy text-xl"></i>
    </div>
    <!-- PAGE TITLE -->
    <h1 class="font-bold text-lg text-navy mb-2">Admin Login</h1>
    <p class="text-sm text-navy-900/80 leading-relaxed mb-5">Login with your admin email to manage complaints and responses.</p>
    <!-- LOGIN FORM -->
    <form id="adminLoginForm" class="bs-reset space-y-3 mt-2 text-left" method="POST" action="#">
      <div class="space-y-3">
        <div>
          <label for="adminUsername" class="block text-[13px] font-semibold text-navy mb-1">Username</label>
          <input required type="text" id="adminUsername" placeholder="Enter admin username" autocomplete="username" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
        <div>
          <label for="adminPassword" class="block text-[13px] font-semibold text-navy mb-1">Password</label>
          <div class="relative">
            <input required type="password" id="adminPassword" placeholder="Enter your password" autocomplete="current-password" minlength="4" class="border border-navy-100 rounded pl-3.5 pr-11 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
            <button type="button" data-toggle-password="adminPassword" class="absolute right-1 top-1/2 -translate-y-1/2 p-2 text-navy-900/50 hover:text-navy transition" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="bg-navy text-white text-[15px] font-semibold px-6 py-2 rounded hover:bg-navy-700 transition w-full">Login</button>
        <p id="adminLoginMsg" class="hidden text-[13px] text-center mt-2"></p>
      </div>
    </form>
  </div>
</section>

<!-- ================= FOOTER ================= -->
<!-- FOOTER: site footer (injected from components/footer.html) -->
<!-- FOOTER (shared: components/footer.html) -->
<div data-component="footer" class="mt-auto"></div>

</body>
</html>
