<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Project | Admin | Trishan Infotech</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin view of pending projects per user.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css?v=10">
<script src="../../../scripts/script.js?v=8" defer></script>
<script>window.ADMIN_PROJECT_MODE = 'pending';</script>
<script src="../../../scripts/accounts/admin/admin-projects.js?v=8" defer></script>
<script src="../../../scripts/accounts/admin/shell.js?v=4" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- HEADER: admin dashboard shell (sidebar + topbar, injected by shell.js) -->
<!-- ADMIN DASHBOARD SHELL (sidebar + topbar) -->
<div id="adminShell" data-page="p-pending"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- PENDING PROJECTS SECTION -->
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-6xl mx-auto">
    <!-- PAGE TITLE + SEARCH -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div class="min-w-0">
        <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-navy-900 mb-1.5">Pending Project</h1>
        <p class="hero-lead text-sm text-navy-900/60">Hi <span id="adminProjectsName">Admin</span>, pick a user to see all their projects.</p>
      </div>
      <!-- USER SEARCH -->
      <div class="w-full md:w-72 shrink-0">
        <label for="userSearch" class="sr-only">Search users</label>
        <div class="relative">
          <i class="bi bi-search absolute left-3.5 top-1/2 -translate-y-1/2 text-navy-900/40 text-sm"></i>
          <input type="search" id="userSearch" placeholder="Search by name, email or phone…" autocomplete="off" class="border border-navy-100 rounded pl-10 pr-3.5 py-2.5 text-sm w-full bg-white focus:outline-none focus:ring-2 focus:ring-navy-700">
        </div>
      </div>
    </div>
    <!-- USER CARDS -->
    <div id="userCards" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>
    <p class="text-[13px] text-navy-900/50 text-center">Click a user card to see their projects in a popup.</p>
  </div>
</section>

</body>
</html>
