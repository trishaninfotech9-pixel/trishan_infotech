<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Project | Admin | Trishan Infotech</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin view of pending projects per user.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css?v=8">
<script src="../../../scripts/script.js?v=8" defer></script>
<script>window.ADMIN_PROJECT_MODE = 'pending';</script>
<script src="../../../scripts/accounts/admin/admin-projects.js?v=4" defer></script>
<script src="../../../scripts/accounts/admin/shell.js?v=4" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- HEADER: admin dashboard shell (sidebar + topbar, injected by shell.js) -->
<!-- ADMIN DASHBOARD SHELL (sidebar + topbar) -->
<div id="adminShell" data-page="p-pending"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- PENDING PROJECTS SECTION -->
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-6xl mx-auto">
    <!-- PAGE TITLE -->
    <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-navy-900 mb-1.5">Pending Project</h1>
    <p class="hero-lead text-sm text-navy-900/60 mb-6">Hi <span id="adminProjectsName">Admin</span>, pick a user to see all their projects.</p>
    <!-- USER DROPDOWN -->
    <div class="border border-navy-100 rounded p-4 sm:p-5 mb-4 bg-white">
      <label for="userSelect" class="block text-[13px] font-semibold text-navy mb-1">Select User</label>
      <select id="userSelect" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700 bg-white">
        <option value="">— Choose a user —</option>
      </select>
      <p id="userInfo" class="text-[13px] text-navy-900/60 mt-2 break-all"></p>
    </div>
    <!-- PROJECT TABLE -->
    <div id="projectTableWrap" class="space-y-3"></div>
  </div>
</section>

</body>
</html>
