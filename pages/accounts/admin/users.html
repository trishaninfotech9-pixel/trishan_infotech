<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users | Admin | Trishan Infotech</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin view of users and their projects.">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="../../../styles/style.css">
<script src="../../../scripts/script.js" defer></script>
<script src="../../../scripts/accounts/admin/admin-users.js" defer></script>
<script src="../../../scripts/accounts/admin/shell.js" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<div class="scroll-progress" aria-hidden="true"></div>

<!-- ADMIN DASHBOARD SHELL (sidebar + topbar) -->
<div id="adminShell" data-page="users"></div>

<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-3xl mx-auto" data-animate="fade-up">
    <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-gradient mb-1.5">Users</h1>
    <p class="hero-lead text-sm text-navy-900/70 mb-6">Hi <span id="adminUsersName">Admin</span>, pick a user to see and manage their projects.</p>

    <div class="border border-navy-100 rounded p-4 sm:p-5 mb-4">
      <label for="userSelect" class="block text-[13px] font-semibold text-navy mb-1">Select User</label>
      <select id="userSelect" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700 bg-white">
        <option value="">— Choose a user —</option>
      </select>
      <p id="userInfo" class="text-[13px] text-navy-900/60 mt-2"></p>
    </div>

    <div id="userProjectList" class="space-y-3 mb-4"></div>

    <form id="addProjectForm" class="hidden border border-navy-100 rounded p-4 sm:p-5 space-y-3">
      <p class="text-[11px] font-bold uppercase tracking-wide text-navy-900/50">Add Project</p>
      <div>
        <label for="projectName" class="block text-[13px] font-semibold text-navy mb-1">Project Name</label>
        <input required type="text" id="projectName" maxlength="150" placeholder="Enter project name" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
      </div>
      <div>
        <label for="projectDetails" class="block text-[13px] font-semibold text-navy mb-1">Project Details</label>
        <textarea id="projectDetails" rows="3" maxlength="2000" placeholder="Enter project details" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700"></textarea>
      </div>
      <div>
        <label for="projectBudget" class="block text-[13px] font-semibold text-navy mb-1">Project Budget</label>
        <input type="number" id="projectBudget" min="0" step="0.01" placeholder="Enter project budget" class="border border-navy-100 rounded px-3.5 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-navy-700">
      </div>
      <div class="flex items-center gap-2">
        <button type="submit" class="bg-navy text-white text-sm font-semibold px-5 py-2.5 min-h-[44px] rounded hover:bg-navy-700 transition inline-flex items-center gap-2"><i class="bi bi-plus-circle"></i>Add Project</button>
        <span id="projectMsg" class="text-[13px] hidden"></span>
      </div>
    </form>
  </div>
</section>

</body>
</html>
