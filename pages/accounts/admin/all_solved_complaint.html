<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solved Complaint | Admin | Trishan Infotech</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin view of solved complaints.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css?v=15">
<script src="../../../scripts/script.js?v=9" defer></script>
<script src="../../../scripts/accounts/admin/admin-solved.js?v=4" defer></script>
<script src="../../../scripts/accounts/admin/shell.js?v=4" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- HEADER: admin dashboard shell (sidebar + topbar, injected by shell.js) -->
<!-- ADMIN DASHBOARD SHELL (sidebar + topbar) -->
<div id="adminShell" data-page="solved"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- SOLVED COMPLAINTS SECTION -->
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-6xl mx-auto" id="adminSolvedWrap">
    <p class="text-[12px] font-semibold tracking-wide text-navy-900/50 mb-1" id="adminDateLine">TODAY</p>
    <!-- PAGE TITLE + SEARCH -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div class="min-w-0">
        <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-navy-900 mb-1.5">Solved Complaint</h1>
        <p class="hero-lead text-sm text-navy-900/60">Hi <span id="adminSolvedName">Admin</span>, complaints marked solved with the checkbox appear here.</p>
      </div>
      <!-- USER SEARCH (component: trishanSearchBox('[data-search-box]')) -->
      <div class="w-full md:w-72 shrink-0" data-search-box data-placeholder="Search by user, project…"></div>
    </div>
    <!-- SOLVED LIST -->
    <div id="solvedList" class="space-y-4"></div>
  </div>
</section>

</body>
</html>
