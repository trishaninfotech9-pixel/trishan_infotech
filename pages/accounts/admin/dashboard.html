<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Admin | Trishan Infotech</title>
<link rel="icon" type="image/png" href="../../../images/logo.png">
<meta name="description" content="Admin dashboard overview.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C4A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<link rel="stylesheet" href="../../../styles/style.css?v=8">
<script src="../../../scripts/script.js?v=8" defer></script>
<script src="../../../scripts/accounts/admin/dashboard.js" defer></script>
<script src="../../../scripts/accounts/admin/shell.js?v=4" defer></script>
</head>
<body class="bg-white text-navy-900 min-h-screen flex flex-col">
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= HEADER ================= -->
<!-- HEADER: admin dashboard shell (sidebar + topbar, injected by shell.js) -->
<!-- ADMIN DASHBOARD SHELL (sidebar + topbar) -->
<div id="adminShell" data-page="dashboard"></div>

<!-- ================= MAIN CONTENT ================= -->
<!-- DASHBOARD OVERVIEW SECTION -->
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-10 md:py-14 w-full">
  <div class="max-w-6xl mx-auto">
    <p class="text-[12px] font-semibold tracking-wide text-navy-900/50 mb-1" id="adminDashDate">TODAY</p>
    <!-- PAGE TITLE -->
    <h1 class="hero-title text-2xl sm:text-3xl font-extrabold text-navy-900 mb-1.5">Dashboard</h1>
    <p class="hero-lead text-sm text-navy-900/60 mb-6">Hi <span id="dashAdminName">Admin</span>, here is what is happening across your users today.</p>

    <!-- STAT CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
      <div class="bg-white border border-navy-100 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start justify-between mb-4"><span class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center"><i class="bi bi-people text-navy"></i></span><span class="text-[11px] font-semibold text-navy-900/40">live</span></div>
        <p class="text-3xl font-extrabold text-navy-900" data-stat="users">–</p>
        <p class="text-[13px] text-navy-900/60 mt-1">Total Users</p>
      </div>
      <div class="bg-white border border-navy-100 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start justify-between mb-4"><span class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center"><i class="bi bi-inbox text-navy"></i></span><span class="text-[11px] font-semibold text-navy-900/40">live</span></div>
        <p class="text-3xl font-extrabold text-navy-900" data-stat="pending">–</p>
        <p class="text-[13px] text-navy-900/60 mt-1">New Complaints</p>
      </div>
      <div class="bg-white border border-navy-100 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start justify-between mb-4"><span class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center"><i class="bi bi-check-circle text-navy"></i></span><span class="text-[11px] font-semibold text-navy-900/40">live</span></div>
        <p class="text-3xl font-extrabold text-navy-900" data-stat="solved">–</p>
        <p class="text-[13px] text-navy-900/60 mt-1">Solved</p>
      </div>
      <div class="bg-white border border-navy-100 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start justify-between mb-4"><span class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center"><i class="bi bi-chat-left-text text-navy"></i></span><span class="text-[11px] font-semibold text-navy-900/40">live</span></div>
        <p class="text-3xl font-extrabold text-navy-900" data-stat="responses">–</p>
        <p class="text-[13px] text-navy-900/60 mt-1">Total Responses</p>
      </div>
      <div class="bg-white border border-navy-100 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start justify-between mb-4"><span class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center"><i class="bi bi-envelope-paper text-navy"></i></span><span class="text-[11px] font-semibold text-navy-900/40">live</span></div>
        <p class="text-3xl font-extrabold text-navy-900" data-stat="enquiries">–</p>
        <p class="text-[13px] text-navy-900/60 mt-1">Total Enquiries</p>
      </div>
    </div>
  </div>
</section>

</body>
</html>
