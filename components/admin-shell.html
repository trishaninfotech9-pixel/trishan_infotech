<!-- Admin dashboard shell (ERP style): sidebar + topbar. {{BASE}} is replaced by shell.js -->
<div class="admin-sidebar" id="adminSidebar">
  <a class="admin-brand" href="{{BASE}}pages/accounts/admin/dashboard.html">
    <img src="{{BASE}}images/logo.png" alt="Trishan Infotech logo">
    <span><strong>Trishan Infotech</strong><small>Admin Suite</small></span>
  </a>
  <p class="admin-label">Workspace</p>
  <nav aria-label="Admin">
    <a data-nav="dashboard" href="{{BASE}}pages/accounts/admin/dashboard.html"><i class="bi bi-grid"></i>Dashboard</a>
    <div class="admin-group" id="complaintGroup">
      <button type="button" class="admin-parent" id="complaintParent" aria-expanded="false" aria-controls="complaintSub">
        <span class="admin-parent-label"><i class="bi bi-inbox"></i>Complaint</span><i class="bi bi-chevron-down admin-chev"></i>
      </button>
      <div class="admin-sub" id="complaintSub">
        <a data-nav="all" href="{{BASE}}pages/accounts/admin/all_complaint.html"><i class="bi bi-list-ul"></i>All Complaint</a>
        <a data-nav="solved" href="{{BASE}}pages/accounts/admin/all_sloved_complaint.html"><i class="bi bi-check2-circle"></i>Solved Complaint</a>
        <a data-nav="pending" href="{{BASE}}pages/accounts/admin/all_pending_complaint.html"><i class="bi bi-clock-history"></i>Pending Complaint</a>
        <a data-nav="ignored" href="{{BASE}}pages/accounts/admin/all_ignore_complaint.html"><i class="bi bi-eye-slash"></i>Ignored Complaint</a>
      </div>
    </div>
    <div class="admin-group" id="projectGroup">
      <button type="button" class="admin-parent" id="projectParent" aria-expanded="false" aria-controls="projectSub">
        <span class="admin-parent-label"><i class="bi bi-kanban"></i>Project</span><i class="bi bi-chevron-down admin-chev"></i>
      </button>
      <div class="admin-sub" id="projectSub">
        <a data-nav="p-all" href="{{BASE}}pages/accounts/admin/all_project.html"><i class="bi bi-kanban"></i>All Project</a>
        <a data-nav="p-complete" href="{{BASE}}pages/accounts/admin/all_complete_project.html"><i class="bi bi-check2-square"></i>Complete Project</a>
        <a data-nav="p-pending" href="{{BASE}}pages/accounts/admin/all_pending_project.html"><i class="bi bi-hourglass-split"></i>Pending Project</a>
      </div>
    </div>
    <a data-nav="users" href="{{BASE}}pages/accounts/admin/users.html"><i class="bi bi-people"></i>Users</a>
  </nav>
  <button type="button" data-logout class="admin-logout"><i class="bi bi-box-arrow-right"></i>Logout</button>
</div>
<div class="admin-overlay" id="adminOverlay" aria-hidden="true"></div>
<header class="admin-topbar">
  <button type="button" id="adminMenuBtn" aria-label="Open menu"><i class="bi bi-list"></i></button>
  <label class="admin-search"><i class="bi bi-search"></i><input type="search" placeholder="search record" aria-label="Search"></label>
  <div class="admin-top-right">
    <div class="admin-bell-wrap">
      <button type="button" class="admin-bell" id="adminBellBtn" aria-label="Notifications" aria-expanded="false"><i class="bi bi-bell"></i><span class="admin-count hidden" id="adminBellCount">0</span></button>
      <div class="admin-notif hidden" id="adminNotifDrop" role="menu" aria-label="Notifications"></div>
    </div>
    <div class="admin-chip"><span class="admin-avatar" id="adminAvatar">A</span><span class="admin-who"><strong id="adminChipName">Admin</strong><small>ADMIN</small></span></div>
  </div>
</header>
