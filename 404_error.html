<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Error | Trishan Infotech</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta name="description" content="The page you are looking for was moved, removed, renamed or might never have existed.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E9FAFE;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    .error-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 860px;
      max-height: 100vh;
      padding: 36px 40px;
    }

    .error-text { flex: 1 1 300px; max-width: 340px; }
    .error-text h1 {
      color: #3434C4;
      font-size: clamp(44px, 7vw, 76px);
      font-weight: 900;
      line-height: 1.02;
      margin-bottom: 14px;
    }
    .error-text p {
      color: #5B5BB5;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .error-art { flex: 1 1 320px; max-width: 420px; }
    .error-art svg { display: block; width: 100%; height: auto; max-height: 62vh; }

    @media (max-width: 640px) {
      .error-card { flex-direction: column; gap: 8px; padding: 24px 20px; }
      .error-text { max-width: 100%; text-align: center; }
      .error-actions { justify-content: center; }
      .error-art { max-width: 300px; }
    }
  </style>
</head>
<body>
<!-- BODY START: all visible page content lives inside the body tag -->

<!-- ================= MAIN CONTENT ================= -->
<!-- 404 MESSAGE -->
  <div class="error-card">
    <div class="error-text">
      <h1>404<br>error</h1>
      <p>The page you are looking for was moved, removed, renamed or might never have existed.</p>
    </div>
    <!-- ERROR ILLUSTRATION -->
    <div class="error-art">
      <svg viewBox="0 0 420 340" role="img" aria-label="Explorer with telescope standing on 404">
        <ellipse cx="210" cy="312" rx="150" ry="18" fill="#BFE9F2"/>
        <ellipse cx="120" cy="306" rx="34" ry="8" fill="#A5DEEC"/>
        <ellipse cx="310" cy="306" rx="26" ry="7" fill="#A5DEEC"/>
        <ellipse cx="90" cy="120" rx="52" ry="20" fill="#ffffff"/>
        <ellipse cx="330" cy="105" rx="58" ry="22" fill="#ffffff"/>
        <text x="60" y="290" font-family="Inter, sans-serif" font-size="150" font-weight="900" fill="#ffffff" stroke="#8FD4EA" stroke-width="3">404</text>
      </svg>
    </div>
  </div>

</html>
